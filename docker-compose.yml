services:
  postgres:
    image: postgres:16-alpine
    container_name: securemind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securemind_db}
      POSTGRES_USER: ${POSTGRES_USER:-securemind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securemind_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securemind_user} -d ${POSTGRES_DB:-securemind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securemind_network

  redis:
    image: redis:7-alpine
    container_name: securemind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securemind_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemind_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - securemind_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemind_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l INFO -E
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - securemind_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemind_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l INFO
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - securemind_network

  zap:
    image: zaproxy/zap-stable:latest
    container_name: securemind_zap
    restart: unless-stopped
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=${ZAP_API_KEY:-securemind-zap-api-key} -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    networks:
      - securemind_network

  test_target:
    build:
      context: ./test_target
      dockerfile: Dockerfile
    container_name: securemind_test_target
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - securemind_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: securemind_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - securemind_network

volumes:
  postgres_data:
  redis_data:

networks:
  securemind_network:
    driver: bridge
