<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="60%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>

    <!-- Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Cyan -->
    <radialGradient id="nodeCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Purple -->
    <radialGradient id="nodePurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Emerald -->
    <radialGradient id="nodeEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for Vectors -->
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#3b82f6" fill-opacity="0.3"/>
    </pattern>

    <!-- Filter for Neon Glow -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <rect width="1200" height="750" fill="url(#cyberGrid)"/>

  <!-- Giant Ambient Glow in Center -->
  <circle cx="600" cy="375" r="380" fill="url(#coreGlow)"/>

  <!-- Concentric Orbital Radar Rings -->
  <circle cx="600" cy="375" r="320" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="600" cy="375" r="230" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="14 6" opacity="0.8"/>
  <circle cx="600" cy="375" r="140" fill="none" stroke="#6366f1" stroke-width="1.8" opacity="0.5"/>
  <circle cx="600" cy="375" r="60" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.8"/>

  <!-- Radar Crosshairs & Angle Ticks -->
  <line x1="240" y1="375" x2="960" y2="375" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="600" y1="50" x2="600" y2="700" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Radar Sweeping Beam Accent -->
  <path d="M 600 375 L 825 210 A 320 320 0 0 0 600 55 Z" fill="url(#coreGlow)" opacity="0.35"/>

  <!-- Glowing Interconnection Vectors between Orchestrator and 6 Agents -->
  <!-- Vector to 1: Authorization Agent (Top Left, 370, 160) -->
  <path d="M 600 375 Q 460 250 370 160" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" filter="url(#neon)"/>
  
  <!-- Vector to 2: Recon Agent (Top Right, 830, 160) -->
  <path d="M 600 375 Q 740 250 830 160" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5 3" filter="url(#neon)"/>

  <!-- Vector to 3: Vulnerability Scanning Agent (Right Center, 930, 375) -->
  <path d="M 600 375 L 930 375" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#neon)"/>

  <!-- Vector to 4: Verification Agent (Bottom Right, 830, 590) -->
  <path d="M 600 375 Q 740 500 830 590" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 3" filter="url(#neon)"/>

  <!-- Vector to 5: Risk Assessment Agent (Bottom Left, 370, 590) -->
  <path d="M 600 375 Q 460 500 370 590" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" filter="url(#neon)"/>

  <!-- Vector to 6: Remediation Agent (Left Center, 270, 375) -->
  <path d="M 600 375 L 270 375" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#neon)"/>

  <!-- ============================================== -->
  <!-- CENTRAL AI ORCHESTRATOR NODE -->
  <!-- ============================================== -->
  <g transform="translate(600, 375)">
    <circle r="52" fill="#0b0f19" stroke="#6366f1" stroke-width="3" filter="url(#neon)"/>
    <circle r="44" fill="#1e1b4b" opacity="0.9"/>
    <circle r="36" fill="url(#shieldGrad)" opacity="0.3"/>
    
    <!-- Shield Icon in Center -->
    <path d="M 0 -22 L 18 -14 L 18 6 C 18 18 0 25 0 25 C 0 25 -18 18 -18 6 L -18 -14 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 0 -17 L 13 -10 L 13 5 C 13 14 0 20 0 20 Z" fill="#6366f1" opacity="0.8"/>
    
    <!-- Central Label Badge -->
    <rect x="-65" y="60" width="130" height="26" rx="6" fill="#0b0f19" stroke="#6366f1" stroke-width="1.2"/>
    <text x="0" y="77" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">
      AI ORCHESTRATOR
    </text>
  </g>

  <!-- ============================================== -->
  <!-- AGENT 1: AUTHORIZATION AGENT (Top Left) -->
  <!-- ============================================== -->
  <g transform="translate(370, 160)">
    <circle r="38" fill="#091e14" stroke="#10b981" stroke-width="2.5" filter="url(#neon)"/>
    <circle r="28" fill="#064e3b" opacity="0.6"/>
    <!-- Lock Check Icon -->
    <path d="M -8 -4 L -8 -10 C -8 -14 -4 -17 0 -17 C 4 -17 8 -14 8 -10 L 8 -4 L 10 -4 C 11.5 -4 12 -3 12 -1 L 12 11 C 12 13 11 14 9 14 L -9 14 C -11 14 -12 13 -12 11 L -12 -1 C -12 -3 -11 -4 -10 -4 Z" fill="#10b981"/>
    <rect x="-85" y="46" width="170" height="24" rx="5" fill="#061f14" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="62" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      1. AUTHORIZATION AGENT
    </text>
  </g>

  <!-- ============================================== -->
  <!-- AGENT 2: RECONNAISSANCE AGENT (Top Right) -->
  <!-- ============================================== -->
  <g transform="translate(830, 160)">
    <circle r="38" fill="#082029" stroke="#06b6d4" stroke-width="2.5" filter="url(#neon)"/>
    <circle r="28" fill="#164e63" opacity="0.6"/>
    <!-- Search / Radar Icon -->
    <circle cx="-2" cy="-4" r="10" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <line x1="6" y1="4" x2="14" y2="12" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="-85" y="46" width="170" height="24" rx="5" fill="#082029" stroke="#06b6d4" stroke-width="1"/>
    <text x="0" y="62" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      2. RECONNAISSANCE AGENT
    </text>
  </g>

  <!-- ============================================== -->
  <!-- AGENT 3: SCANNING AGENT (Right Center) -->
  <!-- ============================================== -->
  <g transform="translate(930, 375)">
    <circle r="38" fill="#131238" stroke="#6366f1" stroke-width="2.5" filter="url(#neon)"/>
    <circle r="28" fill="#312e81" opacity="0.6"/>
    <!-- Crosshair DAST Icon -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <line x1="-16" y1="0" x2="-6" y2="0" stroke="#818cf8" stroke-width="2.5"/>
    <line x1="6" y1="0" x2="16" y2="0" stroke="#818cf8" stroke-width="2.5"/>
    <line x1="0" y1="-16" x2="0" y2="-6" stroke="#818cf8" stroke-width="2.5"/>
    <line x1="0" y1="6" x2="0" y2="16" stroke="#818cf8" stroke-width="2.5"/>
    <rect x="-85" y="46" width="170" height="24" rx="5" fill="#131238" stroke="#6366f1" stroke-width="1"/>
    <text x="0" y="62" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      3. VULN SCANNING (ZAP)
    </text>
  </g>

  <!-- ============================================== -->
  <!-- AGENT 4: VERIFICATION AGENT (Bottom Right) -->
  <!-- ============================================== -->
  <g transform="translate(830, 590)">
    <circle r="38" fill="#240e3b" stroke="#a855f7" stroke-width="2.5" filter="url(#neon)"/>
    <circle r="28" fill="#581c87" opacity="0.6"/>
    <!-- Checkmark Shield Icon -->
    <path d="M -8 1 L -2 7 L 10 -5" fill="none" stroke="#d8b4fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-85" y="46" width="170" height="24" rx="5" fill="#240e3b" stroke="#a855f7" stroke-width="1"/>
    <text x="0" y="62" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      4. VERIFICATION AGENT
    </text>
  </g>

  <!-- ============================================== -->
  <!-- AGENT 5: RISK ASSESSMENT AGENT (Bottom Left) -->
  <!-- ============================================== -->
  <g transform="translate(370, 590)">
    <circle r="38" fill="#2d1c07" stroke="#f59e0b" stroke-width="2.5" filter="url(#neon)"/>
    <circle r="28" fill="#78350f" opacity="0.6"/>
    <!-- Triangle Warning / Matrix Icon -->
    <path d="M 0 -13 L 13 11 L -13 11 Z" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="0" y1="-4" x2="0" y2="3" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="7" r="1.5" fill="#fbbf24"/>
    <rect x="-85" y="46" width="170" height="24" rx="5" fill="#2d1c07" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="62" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      5. RISK ASSESSMENT AGENT
    </text>
  </g>

  <!-- ============================================== -->
  <!-- AGENT 6: REMEDIATION AGENT (Left Center) -->
  <!-- ============================================== -->
  <g transform="translate(270, 375)">
    <circle r="38" fill="#2d0b16" stroke="#f43f5e" stroke-width="2.5" filter="url(#neon)"/>
    <circle r="28" fill="#881337" opacity="0.6"/>
    <!-- Code Bracket / Wrench Icon -->
    <path d="M -6 -8 L -12 0 L -6 8" fill="none" stroke="#fda4af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 6 -8 L 12 0 L 6 8" fill="none" stroke="#fda4af" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2" y1="-9" x2="-2" y2="9" stroke="#fda4af" stroke-width="2"/>
    <rect x="-85" y="46" width="170" height="24" rx="5" fill="#2d0b16" stroke="#f43f5e" stroke-width="1"/>
    <text x="0" y="62" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      6. REMEDIATION AGENT
    </text>
  </g>

  <!-- ============================================== -->
  <!-- FLOATING TELEMETRY GLASS CARDS (OVERLAYS) -->
  <!-- ============================================== -->
  <!-- Top Left: Scope & SSRF Guard -->
  <g transform="translate(50, 45)">
    <rect width="260" height="65" rx="8" fill="#090d16" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="22" r="5" fill="#10b981"/>
    <text x="35" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Multi-Hop SSRF Guard</text>
    <text x="35" y="46" fill="#94a3b8" font-family="monospace" font-size="10">Target Scope: Strict FQDN</text>
    <rect x="180" y="14" width="65" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="212" y="27" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PROTECTED</text>
  </g>

  <!-- Bottom Right: Code Patch Generated -->
  <g transform="translate(890, 640)">
    <rect width="260" height="65" rx="8" fill="#090d16" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="22" r="5" fill="#f43f5e"/>
    <text x="35" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Remediation Engine</text>
    <text x="35" y="46" fill="#94a3b8" font-family="monospace" font-size="10">AST-Validated Code Diffs</text>
    <rect x="180" y="14" width="65" height="18" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="212" y="27" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">VERIFIED</text>
  </g>
</svg>
